<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rider</title>
<style>:root{--bg:#f2f4f8;--cd:#fff;--tx:#18212d;--mu:#667386;--pr:#1F4E78;--ok:#1a7f37;--bad:#c62828;--wn:#b26a00;--bd:#d8dde6}@media(prefers-color-scheme:dark){:root{--bg:#11151b;--cd:#1b212a;--tx:#e8ecf2;--mu:#97a2b3;--pr:#4f8fcb;--ok:#4caf50;--bad:#ef7070;--wn:#e0a040;--bd:#313a47}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
header{background:var(--pr);color:#fff;display:flex;align-items:center;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}header b{font-size:18px;margin-right:auto}
.lo{background:rgba(255,255,255,.2);color:#fff;border:0;padding:7px 12px;border-radius:8px;font-weight:600;cursor:pointer}
main{max-width:720px;margin:auto;padding:14px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}h2{margin:0 0 8px;font-size:16px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1;min-width:0}
button.b{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:13px 14px;font-size:15px;font-weight:600;width:100%;margin-top:8px;cursor:pointer}button.b.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}button:disabled{opacity:.5}
.bg{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bd);color:var(--tx)}.bg.ok{background:#1a7f3722;color:var(--ok)}.bg.bad{background:#c6282822;color:var(--bad)}.bg.go{background:#1F4E7822;color:var(--pr)}.bg.wn{background:#b26a0022;color:var(--wn)}
.cl{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:14px}.mu{color:var(--mu);font-size:12px}.bd{color:var(--bad)}.ok{color:var(--ok)}a{color:var(--pr)}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.k div{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px}.k small{color:var(--mu);display:block}.k b{font-size:19px}
#lg{max-width:360px;margin:70px auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9}.ov>.c{width:100%;max-width:520px;max-height:92vh;overflow:auto;margin:0;border-radius:16px 16px 0 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pc{cursor:pointer}.big{font-size:26px;font-weight:700}</style>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body>
<div id="lg" class="c"><h2>Rider</h2><input id="pin" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key==='Enter')login()"><button class="b" onclick="login()">Open</button><div id="le" class="bd" style="margin-top:8px"></div></div>
<div id="ap" hidden><header><b>Rider &mdash; Lahore parcels</b><button class="lo" onclick="logout()">Log out</button></header>
<main><div class="k"><div><small>Open parcels</small><b id="k1">0</b></div><div><small>Delivered today</small><b id="k2">0</b></div><div><small>COD collected</small><b id="k3">0</b></div></div>
<div class="r"><button class="b" onclick="startScan()">Scan parcel</button><button class="b s" onclick="load()">Refresh</button></div>
<div class="c" style="margin-top:12px"><div class="r"><input id="mn" inputmode="numeric" placeholder="Or type order number"><button class="b" style="width:auto;margin:0;flex:none" onclick="find($('mn').value)">Find</button></div></div>
<div id="list"></div></main></div>
<div id="sc" class="ov" hidden><div class="c"><h2>Point the camera at the parcel code</h2><div id="reader"></div><button class="b s" onclick="stopScan()">Close camera</button></div></div>
<div id="dt" class="ov" hidden><div class="c" id="dc"></div></div>
<script src="../config.js"></script>
<script>const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const $=i=>document.getElementById(i);const money=n=>Number(n||0).toLocaleString('en-US');let pin='';
async function api(a,x){let r,t;try{r=await fetch(API,{method:'POST',body:JSON.stringify(Object.assign({a,pin},x||{}))});t=await r.text()}catch(e){throw new Error('Cannot reach server. Check internet.')}
 let j;try{j=JSON.parse(t)}catch(e){throw new Error('Server returned a web page. Check the config.js URL and that Web App access is Anyone.')}if(j.error)throw new Error(j.error);return j}
function badge(s){s=String(s||'').trim();if(!s)return '<span class="bg">Not booked</span>';const c=/^deliver/i.test(s)?'ok':/return|cancel|cancal|expire/i.test(s)?'bad':/out|picked|transit|dispatch/i.test(s)?'go':'wn';return '<span class="bg '+c+'">'+esc(s)+'</span>'}
function logout(){try{sessionStorage.removeItem('pin')}catch(e){}location.reload()}
let cur=null,qr=null,rows=[];
async function login(){pin=$('pin').value.trim()||pin;$('le').textContent='';try{await load();try{sessionStorage.setItem('pin',pin)}catch(e){}$('lg').hidden=true;$('ap').hidden=false}catch(e){$('le').textContent=e.message}}
async function load(){const r=await api('riderList');rows=r.rows;$('k1').textContent=rows.length;$('k2').textContent=r.today.delivered;$('k3').textContent=money(r.today.cod);
 $('list').innerHTML=rows.map(x=>'<div class="c pc" data-n="'+x.no+'" onclick="show(this.dataset.n)"><div class="r" style="justify-content:space-between"><b>#'+x.no+' '+esc(x.name)+'</b><span style="flex:none">'+badge(x.status)+'</span></div><div class="mu">'+esc(x.city)+' &middot; '+esc(x.address)+'</div><div class="cl" style="border:0"><span>COD</span><b>'+money(x.cod)+'</b></div></div>').join('')||'<div class="c mu">No open parcels.</div>'}
function show(n){const x=rows.find(r=>String(r.no)===String(n));if(x)open_(x)}
async function find(t){const v=String(t||'').trim();if(!v)return;try{const r=await api('scan',{code:v});open_(r.order);$('mn').value=''}catch(e){alert(e.message)}}
function open_(x){cur=x;$('dt').hidden=false;$('dc').innerHTML='<div class="r" style="justify-content:space-between"><h2>#'+x.no+'</h2><span style="flex:none">'+badge(x.status)+'</span></div>'+
 '<div class="big">COD '+money(x.cod)+'</div><div style="margin:6px 0"><b>'+esc(x.name)+'</b></div><div><a href="tel:'+esc(x.phone)+'">Call '+esc(x.phone)+'</a></div>'+
 '<div style="margin:6px 0">'+esc(x.city)+' &middot; '+esc(x.address)+' &middot; <a target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.address+' '+x.city)+'">Map</a></div><div class="mu">'+esc(x.items)+'</div>'+
 '<div class="g2" style="margin-top:10px"><button class="b" onclick="setS(\'Out for Delivery\')">Picked up</button><button class="b" onclick="setS(\'Pending\')" style="background:var(--wn)">Pending</button><button class="b" onclick="setS(\'Delivered\')" style="background:var(--ok)">Delivered</button><button class="b" onclick="setS(\'Returned\')" style="background:var(--bad)">Returned</button></div><button class="b s" onclick="$(\'dt\').hidden=true">Close</button>'}
async function setS(s){if(s==='Returned'&&!confirm('Mark #'+cur.no+' as Returned?'))return;try{await api('riderSet',{orders:[cur.no],status:s});$('dt').hidden=true;await load()}catch(e){alert(e.message)}}
function startScan(){if(typeof Html5Qrcode==='undefined'){alert('Scanner could not load. Type the order number instead.');return}$('sc').hidden=false;qr=new Html5Qrcode('reader');
 qr.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:160}},t=>{stopScan();const m=String(t).match(/\d{3,}/);find(m?m[0]:t)},()=>{}).catch(e=>{$('sc').hidden=true;alert('Camera not available. Allow camera access, or type the order number.')})}
function stopScan(){$('sc').hidden=true;if(qr){qr.stop().then(()=>qr.clear()).catch(()=>{});qr=null}}
try{pin=sessionStorage.getItem('pin')||'';if(pin)login()}catch(e){}
</script></body></html>
